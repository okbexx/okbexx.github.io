name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: okbexx-site-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/okbexx/okbexx-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner_type="$(gh api "/users/${{ github.repository_owner }}" --jq '.type')"
          if [ "$owner_type" = "Organization" ]; then
            endpoint="/orgs/${{ github.repository_owner }}/packages/container/okbexx-site/visibility"
          else
            endpoint="/user/packages/container/okbexx-site/visibility"
          fi
          gh api --method PATCH "$endpoint" -f visibility=public || true

      - name: Deploy to HostHatch
        env:
          DEPLOY_KEY: ${{ secrets.HOSTHATCH_OKBEXX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Missing HOSTHATCH_OKBEXX_DEPLOY_KEY secret"
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/okbexx-site-deploy"
          chmod 600 "$HOME/.ssh/okbexx-site-deploy"
          cp deploy/hosthatch/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/okbexx-site-deploy" \
            -p 22222 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            okbexx-deploy@103.73.66.181 \
            "deploy ${{ github.sha }}"
