server {
    listen 80;
    listen [::]:80;
    server_name okbexx.com www.okbexx.com;
    access_log /var/log/nginx/sites/okbexx.com.access.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.okbexx.com;
    access_log /var/log/nginx/sites/www.okbexx.com.access.log;

    ssl_certificate /etc/ssl/certs/okbexx.com-origin.pem;
    ssl_certificate_key /etc/ssl/private/okbexx.com-origin.key;

    location / {
        return 301 https://okbexx.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name okbexx.com;
    access_log /var/log/nginx/sites/okbexx.com.access.log;

    ssl_certificate /etc/ssl/certs/okbexx.com-origin.pem;
    ssl_certificate_key /etc/ssl/private/okbexx.com-origin.key;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
